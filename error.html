<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ error_code|default(500) }} — Évaluation Fournisseurs AIBD</title>
  <style>
    body{font-family:Arial,sans-serif;background:#f6f7f9;margin:0;color:#1f2937}
    .wrap{max-width:720px;margin:8vh auto;padding:24px}
    .card{background:#fff;border-radius:14px;padding:32px;box-shadow:0 8px 30px rgba(0,0,0,.08)}
    h1{margin-top:0;font-size:28px}
    p{line-height:1.6}
    .code{display:inline-block;padding:6px 10px;border-radius:8px;background:#eef2ff;font-weight:700}
    a{display:inline-block;margin-top:16px;padding:10px 16px;border-radius:8px;background:#111827;color:#fff;text-decoration:none}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="code">{{ error_code|default(500) }}</div>
      <h1>{{ error_title|default("Une erreur est survenue") }}</h1>
      <p>{{ error_message|default("Le serveur n’a pas pu traiter votre demande. Veuillez réessayer.") }}</p>
      <a href="{{ home_url|default("/") }}">Retour</a>
    </section>
  </main>
</body>
</html>
