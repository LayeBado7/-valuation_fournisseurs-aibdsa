services:
  - type: web
    name: evaluation-fournisseurs-aibd
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 2 -b 0.0.0.0:$PORT app:app
    healthCheckPath: /health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: evaluation-fournisseurs-db
          property: connectionString
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrateur Pôle SI
      - key: MAX_CONTENT_LENGTH
        value: "10485760"
databases:
  - name: evaluation-fournisseurs-db
    databaseName: aibd_fournisseurs
    user: aibd_admin
