{% extends 'base.html' %}{% block content %}<div class="row justify-content-center"><div class="col-lg-8"><div class="card shadow-sm"><div class="card-body p-4"><h2>Créer un compte fournisseur</h2><p class="text-muted">Seul l’administrateur peut créer les comptes. Aucun formulaire d’inscription public n’est disponible.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div class="row g-3"><div class="col-md-8"><label class="form-label">Entreprise *</label><input name="entreprise" class="form-control" required></div><div class="col-md-4"><label class="form-label">Criticité</label><select name="criticality" class="form-select"><option>À classer</option><option>Critique</option><option>Important</option><option>Standard</option></select></div><div class="col-md-6"><label class="form-label">Identifiant *</label><input name="username" class="form-control" required></div><div class="col-md-6"><label class="form-label">Mot de passe initial *</label><input name="password" type="password" class="form-control" minlength="8" required></div><div class="col-md-6"><label class="form-label">Contact</label><input name="contact" class="form-control"></div><div class="col-md-6"><label class="form-label">Email</label><input name="email" type="email" class="form-control"></div><div class="col-12"><label class="form-label">Description</label><textarea name="description" class="form-control"></textarea></div></div><button class="btn btn-primary mt-4">Créer le compte</button> <a class="btn btn-outline-secondary mt-4" href="{{url_for('dashboard')}}">Annuler</a></form></div></div></div></div>{% endblock %}
